[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prodml"
version = "0.1.0"
description = "NYC green taxi trip-duration model served as a production-style API"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "skl2onnx",
    "onnxruntime",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    # Module 2: what the SERVING image needs to load models:/<name>/Production
    "mlflow-skinny==3.17.1",
    # CPU-only wheel on Linux (the Docker image): ~300 MB smaller than the CUDA build
    "xgboost-cpu; sys_platform == 'linux'",
    "xgboost; sys_platform != 'linux'",
    "pyyaml",
]

[project.optional-dependencies]
# Everything needed to TRAIN, track and version (not baked into the API image).
train = [
    "mlflow==3.17.1",
    "matplotlib",
    "optuna",
    "dvc",
]
# Mini Project 3 (each extra is only installed where it is needed).
serving = ["bentoml>=1.4,<1.5", "onnxruntime", "pandas", "pyarrow", "scikit-learn"]
runtimes = ["onnxruntime", "openvino", "onnx", "skl2onnx"]
streaming = ["redis>=5"]
load = ["locust"]
dev = [
    "pytest", "pytest-cov", "ruff", "black", "mypy", "httpx", "pre-commit",
    "mlflow==3.17.1", "matplotlib", "optuna",
    "redis>=5", "fakeredis", "onnxruntime", "openvino", "onnx", "pyarrow",
]

# After `pip install -e .` you can type `prodml-train` anywhere.
[project.scripts]
prodml-train = "prodml.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The coverage gate: pytest FAILS if coverage drops below 70%.
addopts = "--cov=src/prodml --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
# The baseline notebook is deliberately messy: lint only real code.
extend-exclude = ["notebooks"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I"]
