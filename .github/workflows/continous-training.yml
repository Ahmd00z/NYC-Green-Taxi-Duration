name: Continuous Training

# trigger -> dvc pull -> validate data -> train -> evaluate
#         -> gate (better than Production?) -> promote to STAGING -> build image -> notify
#
# Production is NEVER promoted automatically: the last job waits for a human to approve the
# "production" GitHub Environment (Settings -> Environments -> production -> Required reviewers).
on:
  # 1) weekly cron
  # schedule:
  # - cron: "0 3 * * 1" # Mondays 03:00 UTC
  # 2) manual run, with a data-version input
  workflow_dispatch:
    inputs:
      data_version:
        description: "Git ref (tag / commit / branch) whose data/*.dvc pointer to train on"
        required: false
        default: "main"
      margin:
        description: "Candidate must beat Production MAE by this fraction (0.02 = 2%)"
        required: false
        default: "0.0"
  # 3) external webhook: Module 5's drift detector fires here.
  #    curl -X POST -H "Authorization: Bearer $TOKEN" \
  #      https://api.github.com/repos/<user>/<repo>/dispatches \
  #      -d '{"event_type":"drift-detected","client_payload":{"data_version":"main"}}'
  repository_dispatch:
    types: [drift-detected, new-data, performance-degraded]

permissions:
  contents: read

env:
  # Where the MLflow server lives. A repository VARIABLE (not a secret): it is just a URL
  # on your machine, e.g. http://localhost:5000
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}

jobs:
  train:
    # MLflow and the DVC storage live on YOUR machine, which GitHub's cloud runners cannot
    # reach. Register a self-hosted runner there (Settings -> Actions -> Runners).
    runs-on: ${{ vars.CT_RUNNER || 'self-hosted' }}
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      version: ${{ steps.promote.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_version || github.event.client_payload.data_version || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[train]"

      - name: dvc pull
        run: dvc pull data/green_tripdata_2019-08.parquet.dvc

      - name: Validate the data
        run: python -m prodml.pipeline validate

      - name: Train + evaluate (dvc repro)
        run: dvc repro pipelines/dvc.yaml

      - name: Gate and promote to Staging (only if better than Production)
        id: promote
        run: |
          RUN_ID=$(python -c "import json;print(json.load(open('metrics/train_run.json'))['run_id'])")
          python -m prodml.registry promote-if-better \
            --run-id "$RUN_ID" \
            --margin "${{ inputs.margin || '0.0' }}" | tee result.json
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Notify (job summary)
        if: always()
        run: |
          {
            echo "## Continuous training"
            echo "- trigger: \`${{ github.event_name }}\`"
            echo "- data ref: \`${{ inputs.data_version || github.event.client_payload.data_version || github.ref_name }}\`"
            echo '```json'
            cat result.json 2>/dev/null || echo '{"note": "no result: an earlier step failed"}'
            echo '```'
            cat metrics/scores.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: train
    if: needs.train.outputs.promoted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/prodml-api:ct-${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/prodml-api:latest

  # Human approval gate: this job only starts after a reviewer approves the
  # "production" environment. Staging is automatic, Production never is.
  promote-production:
    needs: [train, image]
    if: needs.train.outputs.promoted == 'true'
    runs-on: ${{ vars.CT_RUNNER || 'self-hosted' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[train]"
      - run: python -m prodml.registry promote-production --version "${{ needs.train.outputs.version }}"
