# Mini Project 3: Airflow + Redis (+ the BentoML server) next to the Module 2 stack.
#
# Run from the REPO ROOT, after `docker compose -f docker/docker-compose.yml up -d mlflow`:
#
#   docker compose -f docker/docker-compose.serving.yml up -d --build
#
#   Airflow UI   http://localhost:8081   (user admin; the password is printed in
#                                         `docker compose ... logs airflow`)
#   BentoML      http://localhost:3000   (Swagger UI at /)
#   Redis        localhost:6379
#
# Backfill a week of batch scoring (idempotent, safe to repeat):
#   docker compose -f docker/docker-compose.serving.yml exec airflow \
#       airflow dags backfill batch_scoring -s 2026-10-01 -e 2026-10-07
name: prodml-serving

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  airflow:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    # `standalone` runs scheduler + webserver in ONE container (SQLite metadata DB):
    # fine for a course project, not for production.
    command: standalone
    ports: ["8081:8080"]
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/pipelines/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_CONN_FS_DEFAULT: "fs://?path=/"   # the FileSensor connection
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      PYTHONPATH: /opt/airflow/repo/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../:/opt/airflow/repo

  bento:
    build:
      context: ..
      dockerfile: docker/bento.Dockerfile
    ports: ["3000:3000"]
    environment:
      - MODEL_SOURCE=local
