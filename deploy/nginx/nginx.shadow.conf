# SHADOW mode: every request is answered by STABLE only, and a COPY is sent to the
# canary whose answer is thrown away. Users carry zero risk; you compare logs/latency.
# Use it by setting NGINX_CONF=nginx.shadow.conf before `docker compose up`.
events {}

http {
  log_format shadow '$time_iso8601 deployment=stable status=$status '
                    'upstream_time=$upstream_response_time request_time=$request_time';
  access_log /var/log/nginx/access.log shadow;

  upstream stable { server model-v1:3000; }
  upstream canary { server model-v2:3000; }

  server {
    listen 80;

    location / {
      proxy_pass http://stable;
      mirror /shadow;            # send a copy ...
      mirror_request_body on;    # ... including the JSON body
    }

    location = /shadow {
      internal;
      proxy_pass http://canary$request_uri;   # the answer is discarded by nginx
      proxy_set_header X-Shadow "1";
    }
  }
}
