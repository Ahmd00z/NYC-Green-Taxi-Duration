# Mini Project 3, step 7: nginx as the traffic splitter for a CANARY release.
#
#   client -> nginx :8080 --90%--> model-v1 (stable)
#                         --10%--> model-v2 (canary)
#
# To change the split use:  bash deploy/canary_promote.sh 25   (never hand-edit the block)
# To undo a bad canary:     bash deploy/rollback.sh
events {}

http {
  # One log line per request. The watcher reads "deployment= status= upstream_time=".
  log_format canary '$time_iso8601 deployment=$deployment status=$status '
                    'upstream_time=$upstream_response_time request_time=$request_time';
  access_log /var/log/nginx/access.log canary;

  upstream stable { server model-v1:3000; }
  upstream canary { server model-v2:3000; }

  # CANARY_SPLIT_START
  split_clients "${request_id}" $deployment {
    90% stable;
    * canary;
  }
  # CANARY_SPLIT_END

  server {
    listen 80;

    # The proxy_pass uses the variable, so each request picks stable or canary.
    location / {
      proxy_pass http://$deployment;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      add_header X-Deployment $deployment always;   # which side answered
    }
  }
}
